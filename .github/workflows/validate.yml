name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The corpus must conform to the formal .txt grammar. The checker is
      # `exploitmatic check`, built from the runtime repository; pin this
      # checkout to a runtime release tag once one exists.
      - name: Build exploitmatic from the runtime
        run: |
          git clone --depth 1 https://github.com/exploitmatic/exploitmatic /tmp/exploitmatic
          cd /tmp/exploitmatic
          if [ -f Cargo.toml ]; then WS=.; else WS=cli; fi
          cargo build --release -p exploitmatic --manifest-path "$WS/Cargo.toml"
          cp "$WS/target/release/exploitmatic" /tmp/exploitmatic-check

      - name: Validate every .txt file
        run: |
          find "$GITHUB_WORKSPACE" -name "*.txt" -print0 | xargs -0 -n1 /tmp/exploitmatic-check check

      - name: Check for duplicate solution ids
        run: |
          ids=$(grep -rh '^id:' --include='*.txt' . | sed 's/^id:[[:space:]]*//')
          dupes=$(printf '%s\n' "$ids" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "duplicate ids:"
            printf '%s\n' "$dupes"
            exit 1
          fi
